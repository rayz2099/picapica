# why: 只在 vX.Y.Z tag 发版；CI 不跑测试，产物是二进制和 GHCR 镜像。
name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  GHCR: ghcr.io/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != v* ]]; then
            echo "tag must look like v0.1.0, got ${tag}" >&2
            exit 1
          fi
          version="${tag#v}"
          cargo_ver="$(awk '
            $0 == "[workspace.package]" { in_pkg = 1; next }
            in_pkg && /^\[/ { exit }
            in_pkg && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [[ "${version}" != "${cargo_ver}" ]]; then
            echo "tag ${tag} != Cargo.toml version ${cargo_ver}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  bin:
    needs: version
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: linux-amd64
            archive: tar.gz
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: linux-arm64
            archive: tar.gz
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
            archive: tar.gz
            musl: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-amd64
            archive: tar.gz
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-amd64
            archive: zip
            musl: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: windows-arm64
            archive: zip
            musl: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: matrix.musl
        with:
          target: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target == 'aarch64-pc-windows-msvc'
        with:
          arch: amd64_arm64
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" -p picapica
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          asset="${{ matrix.asset }}"
          archive="${{ matrix.archive }}"
          mkdir -p staging dist
          if [[ -f "target/${target}/release/picapica.exe" ]]; then
            cp "target/${target}/release/picapica.exe" staging/picapica.exe
          else
            cp "target/${target}/release/picapica" staging/picapica
            chmod +x staging/picapica
            cp staging/picapica dist/picapica
          fi
          cp LICENSE README.md staging/
          if [[ "${archive}" == "zip" ]]; then
            (cd staging && tar -a -cf "../dist/picapica-${asset}.zip" *)
          else
            tar -czf "dist/picapica-${asset}.tar.gz" -C staging .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: picapica-${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  docker:
    needs: [version, bin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: picapica-linux-amd64
          path: linux/amd64
      - uses: actions/download-artifact@v4
        with:
          name: picapica-linux-arm64
          path: linux/arm64
      - name: Layout binaries
        run: |
          chmod +x linux/amd64/picapica linux/arm64/picapica
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.GHCR }}:${{ needs.version.outputs.version }}
            ${{ env.GHCR }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: picapica
          package-type: container
          min-versions-to-keep: 3

  release:
    needs: [version, bin, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: Collect archives
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            Pull-through proxy for Docker, Ubuntu, and Fedora.

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ```
      - name: Keep last 3 GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/retain-versions.sh 3
